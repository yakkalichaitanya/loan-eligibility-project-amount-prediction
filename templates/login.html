<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login - AI-Based Loan Eligibility & Amount Prediction System">
    <title>Login - AI Loan Eligibility System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
    <div class="background-glow">
        <div class="glow-sphere glow-1"></div>
        <div class="glow-sphere glow-2"></div>
    </div>

    <div class="login-wrapper">
        <div class="card login-card">
            <div class="login-header">
                <div class="badge">AI Powered Fintech Engine</div>
                <h2>System Login</h2>
                <p>Sign in with your user credentials to access the loan dashboard</p>
            </div>

            {% if success %}
            <div class="success-banner" style="margin-bottom: 1.25rem;">
                <span class="success-icon">✅</span>
                <span>{{ success }}</span>
            </div>
            {% endif %}

            {% if error %}
            <div class="error-banner" style="margin-bottom: 1.25rem;">
                <span class="error-icon">⚠️</span>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="{{ url_for('login') }}" method="POST" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" name="username" placeholder="Enter username" value="{{ username or '' }}" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-actions" style="margin-top: 1.25rem;">
                    <button type="submit" class="btn btn-primary">
                        <span class="btn-text">Sign In</span>
                    </button>
                </div>
            </form>

            <div class="auth-link-box">
                <p>New user? <a href="{{ url_for('register') }}">Create an account</a></p>
            </div>
        </div>
    </div>
</body>
</html>
